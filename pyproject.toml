[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcv-diagnostics"
version = "0.1.0"
description = "Auditable Paper 0 pipeline for TCV/Hermes probabilistic emulation"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
models = [
  "torch>=2.5",
  "wandb>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
